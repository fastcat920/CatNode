name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/release.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/release.yml"
  release:
    types: [published]

jobs:

  build:
    if: github.event_name != 'push' || github.ref_type != 'tag'
    strategy:
      matrix:
        # Include amd64 on all platforms.
        goos: [windows, freebsd, linux, darwin]
        goarch: [amd64, 386]
        exclude:
          # Exclude i386 on darwin.
          - goarch: 386
            goos: darwin
        include:
          # BEIGIN MacOS ARM64
          - goos: darwin
            goarch: arm64
          # END MacOS ARM64
          # BEGIN Linux ARM 5 6 7
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm
            goarm: 6
          - goos: linux
            goarch: arm
            goarm: 5
          # END Linux ARM 5 6 7
          # BEGIN Other architectures
          # BEGIN riscv64 & ARM64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: riscv64
          # END riscv64 & ARM64
          # BEGIN MIPS
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: mips
          # END MIPS
          # BEGIN PPC
          - goos: linux
            goarch: ppc64
          - goos: linux
            goarch: ppc64le
          # END PPC
          # BEGIN FreeBSD ARM
          - goos: freebsd
            goarch: arm64
          - goos: freebsd
            goarch: arm
            goarm: 7
          # END FreeBSD ARM
          # BEGIN S390X
          - goos: linux
            goarch: s390x
          # END S390X
          # END Other architectures
      fail-fast: false

    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v5
      - name: Show workflow information
        id: get_filename
        run: |
          export _NAME=$(jq ".[\"$GOOS-$GOARCH$GOARM$GOMIPS\"].friendlyName" -r < .github/build/friendly-filenames.json)
          echo "GOOS: $GOOS, GOARCH: $GOARCH, GOARM: $GOARM, GOMIPS: $GOMIPS, RELEASE_NAME: $_NAME"
          echo "ASSET_NAME=$_NAME" >> $GITHUB_OUTPUT
          echo "ASSET_NAME=$_NAME" >> $GITHUB_ENV
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'

      - name: Get project dependencies
        run: |
          go mod download
      - name: Get release version
        if: ${{ github.event_name == 'release' }}
        run: |
          echo "version=$(echo $GITHUB_REF | cut -d / -f 3)" >> $GITHUB_ENV
      - name: Get other version
        if: ${{ github.event_name != 'release' }}
        run: |
          echo "version=${{ github.sha }}" >> $GITHUB_ENV
      - name: Build v2node
        run: |
          echo "version: $version"
          mkdir -p build_assets
          GOEXPERIMENT=jsonv2 go build -v -o build_assets/v2node -trimpath -ldflags "-X 'github.com/wyx2685/v2node/cmd.version=$version' -s -w -buildid="

      - name: Build Mips softfloat v2node
        if: matrix.goarch == 'mips' || matrix.goarch == 'mipsle'
        run: |
          echo "version: $version"
          GOEXPERIMENT=jsonv2 GOMIPS=softfloat go build -v -o build_assets/v2node_softfloat -trimpath -ldflags "-X 'github.com/wyx2685/v2node/cmd.version=$version' -s -w -buildid="
      - name: Rename Windows v2node
        if: matrix.goos == 'windows'
        run: |
          cd ./build_assets || exit 1
          mv v2node v2node.exe
      - name: Prepare to release
        run: |
          cp ${GITHUB_WORKSPACE}/README.md ./build_assets/README.md
          cp ${GITHUB_WORKSPACE}/LICENSE ./build_assets/LICENSE
          LIST=('geoip' 'geosite')
          for i in "${LIST[@]}"
          do
            DOWNLOAD_URL="https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/${i}.dat"
            FILE_NAME="${i}.dat"
            echo -e "Downloading ${DOWNLOAD_URL}..."
            curl -L "${DOWNLOAD_URL}" -o ./build_assets/${FILE_NAME}
          done
      - name: Create ZIP archive
        shell: bash
        run: |
          pushd build_assets || exit 1
          touch -mt $(date +%Y01010000) *
          zip -9vr ../v2node-$ASSET_NAME.zip .
          popd || exit 1
          FILE=./v2node-$ASSET_NAME.zip
          DGST=$FILE.dgst
          for METHOD in {"md5","sha1","sha256","sha512"}
          do
            openssl dgst -$METHOD $FILE | sed 's/([^)]*)//g' >>$DGST
          done
      - name: Change the name
        run: |
          mv build_assets v2node-$ASSET_NAME
      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: v2node-${{ steps.get_filename.outputs.ASSET_NAME }}
          path: |
            ./v2node-${{ steps.get_filename.outputs.ASSET_NAME }}/*
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'release'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./v2node-${{ steps.get_filename.outputs.ASSET_NAME }}.zip*
          tag: ${{ github.ref }}
          file_glob: true

  catnode-bundle:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
      - name: Test FCN integration
        run: |
          go test ./core ./node ./api/v2board
          (cd protocol/fcn && go test ./...)
          (cd protocol/fcnv3 && go test ./...)
      - name: Package CatNode
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          name=catnode-linux-${GOARCH}
          mkdir -p "dist/$name"
          version="${GITHUB_REF_NAME:-development}"
          go build -trimpath -ldflags "-s -w -X github.com/wyx2685/v2node/cmd.version=$version" -o "dist/$name/catnode" .
          cp deploy/install.sh deploy/native-install.sh deploy/catnode-fastcat-v2.service deploy/catnode-fastcat-v2-managed.conf LICENSE "dist/$name/"
          mkdir -p "dist/$name/site"
          cp deploy/website/index.html "dist/$name/site/"
          cp protocol/fcn/NOTICE "dist/$name/FCN-NOTICE"
          cp protocol/fcnv3/internal/echparser/LICENSE "dist/$name/FCN-V3-GO-LICENSE"
          if [[ ${GITHUB_REF_TYPE:-} == tag ]]; then
            [[ $version =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo 'Invalid CatNode release tag' >&2; exit 1; }
            sed "s|^base=.*|base=https://github.com/fastcat920/CatNode/releases/download/$version|" deploy/bootstrap.sh > dist/bootstrap.sh
          else
            cp deploy/bootstrap.sh dist/bootstrap.sh
          fi
          (cd dist && tar -czf "$name.tar.gz" "$name" && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v6
        with:
          name: catnode-linux-${{ matrix.arch }}
          path: dist/*
      - name: Upload CatNode bundle
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          overwrite: true
          file: dist/catnode-linux-${{ matrix.arch }}.tar.gz*
          tag: ${{ github.ref }}
          file_glob: true
      - name: Upload bootstrap
        if: github.event_name == 'release' && matrix.arch == 'amd64'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          overwrite: true
          file: dist/bootstrap.sh
          tag: ${{ github.ref }}

  catnode-tag-prerelease:
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    needs: catnode-bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested bundles
        uses: actions/download-artifact@v7
        with:
          pattern: catnode-linux-*
          path: release
      - name: Verify bundles and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          assets=()
          for arch in amd64 arm64; do
            bundle=catnode-linux-$arch
            (
              cd "release/$bundle"
              sha256sum --check --strict "$bundle.tar.gz.sha256"
              tar -tzf "$bundle.tar.gz" "$bundle/FCN-V3-GO-LICENSE" >/dev/null
              bash -n bootstrap.sh
              grep -Fx "base=https://github.com/$GH_REPO/releases/download/$RELEASE_TAG" bootstrap.sh
            )
            assets+=("release/$bundle/$bundle.tar.gz" "release/$bundle/$bundle.tar.gz.sha256")
          done
          bootstrap=release/catnode-linux-amd64/bootstrap.sh
          cmp "$bootstrap" release/catnode-linux-arm64/bootstrap.sh
          publish() {
            local draft
            draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null) || draft=''
            case "$draft" in
              true)
                gh release upload "$RELEASE_TAG" "$bootstrap" "${assets[@]}" --clobber &&
                  gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
                ;;
              false)
                gh release view "$RELEASE_TAG" --json assets --jq '.assets | length == 5' | grep -qx true
                ;;
              *)
                gh release create "$RELEASE_TAG" --verify-tag --prerelease --latest=false \
                  --title "CatNode $RELEASE_TAG" \
                  --notes 'Tested CatNode bundles for Linux amd64 and arm64.' \
                  "$bootstrap" "${assets[@]}"
                ;;
            esac
          }
          for delay in 0 5 15; do
            sleep "$delay"
            if publish; then exit 0; fi
          done
          exit 1
