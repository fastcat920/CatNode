# Install as /etc/systemd/system/catnode-fastcat-v2.service.d/managed.conf.
[Service]
EnvironmentFile=/etc/catnode/fastcat-v2/panel.env
LoadCredential=
LoadCredential=fullchain.pem:/etc/catnode/fastcat-v2/fullchain.pem
LoadCredential=privkey.pem:/etc/catnode/fastcat-v2/privkey.pem
LoadCredential=panel.token:/etc/catnode/fastcat-v2/panel.token
ExecStart=
ExecStart=/usr/local/bin/catnode fastcat-v2 -listen 0.0.0.0:${FASTCAT_PORT} -cert %d/fullchain.pem -key %d/privkey.pem -panel ${FASTCAT_PANEL_URL} -node-id ${FASTCAT_NODE_ID} -panel-token-file %d/panel.token
